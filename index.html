<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MCI Faturamento" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <title>MCI Faturamento</title>
  </head>
  <body class="bg-background text-on-background">
    <div id="root"></div>
    <script>
      // Rede de segurança contra tela branca depois de um deploy: se o app não aparecer em 12 s (arquivos antigos que
      // sumiram do servidor), limpa o service worker e o cache e recarrega, no máximo uma vez a cada 5 minutos.
      // Não apaga o login (localStorage).
      ;(function () {
        try {
          setTimeout(function () {
            var raiz = document.getElementById('root')
            if (raiz && raiz.childElementCount > 0) return
            var chave = 'mci:recuperacao-tela-branca'
            var ultima = Number(sessionStorage.getItem(chave) || 0)
            if (Date.now() - ultima < 300000) return
            sessionStorage.setItem(chave, String(Date.now()))
            var tarefas = []
            if (navigator.serviceWorker) {
              tarefas.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                })
              )
            }
            if (window.caches) {
              tarefas.push(
                caches.keys().then(function (chaves) {
                  return Promise.all(chaves.map(function (c) { return caches.delete(c) }))
                })
              )
            }
            Promise.all(tarefas).catch(function () {}).then(function () { location.reload() })
          }, 12000)
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
